
name: ZENOCL Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenocl-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ZENOCL
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project directory
        shell: bash
        run: |
          if [ -f "./gradlew" ] && [ -f "./build.gradle" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "./zenocl/gradlew" ] && [ -f "./zenocl/build.gradle" ]; then
            echo "PROJECT_DIR=./zenocl" >> "$GITHUB_ENV"
          else
            echo "ERROR: ZENOCL Gradle project not found"
            exit 1
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ZENOCL
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build

      - name: Upload ZENOCL JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZENOCL-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-dev.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
          
