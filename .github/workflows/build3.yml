name: build3

on:
  push:
  workflow_dispatch:

# Новый запуск отменяет предыдущий в той же ветке: два параллельных запуска не конфликтуют
concurrency:
  group: build3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Build
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          # номер запуска и попытки в имени: повторный запуск (Re-run) не упирается в уже существующий артефакт
          name: ZenoCL-${{ github.run_number }}-${{ github.run_attempt }}
          overwrite: true
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
