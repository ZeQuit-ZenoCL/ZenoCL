
name: ZENOCL CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenocl-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile ZENOCL
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            WRAPPER="./gradlew"
          elif [ -f "./zenocl/gradlew" ]; then
            WRAPPER="./zenocl/gradlew"
          else
            WRAPPER=$(find . -type f -name gradlew \
              -not -path './.git/*' -print -quit)

            if [ -z "$WRAPPER" ]; then
              echo "ERROR: Gradle Wrapper not found"
              exit 1
            fi
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERROR: build.gradle not found in $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Build project
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          ./gradlew --no-daemon clean build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Prepare release artifact
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          mapfile -t JARS < <(
            find "$PROJECT_DIR/build/libs" \
              -maxdepth 1 \
              -type f \
              -name "*.jar" \
              ! -name "*-dev.jar" \
              ! -name "*-sources.jar"
          )

          if [ ${#JARS[@]} -eq 0 ]; then
            echo "ERROR: No release JAR found"
            exit 1
          fi

          for jar in "${JARS[@]}"; do
            cp "$jar" artifacts/
            echo "Prepared: $(basename "$jar")"
          done

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZENOCL-${{ github.run_number }}
          path: artifacts/*.jar
          if-no-files-found: error
          retention-days: 30
          
