
name: ZENOCL CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenocl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ZENOCL
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle 9.2.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Find project
        shell: bash
        run: |
          set -e

          BUILD_FILE=$(find . \
            -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            echo "USE_WRAPPER=true" >> "$GITHUB_ENV"
          else
            echo "USE_WRAPPER=false" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ "$USE_WRAPPER" = "true" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon clean build
          else
            gradle --no-daemon clean build
          fi

      - name: Check JAR
        shell: bash
        run: |
          set -e

          mkdir -p release

          find "$PROJECT_DIR/build/libs" \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-dev.jar" \
            ! -name "*-sources.jar" \
            -exec cp {} release/ \;

          if [ -z "$(ls -A release)" ]; then
            echo "ERROR: No production JAR found"
            exit 1
          fi

          ls -lh release/

      - name: Upload ZENOCL
        uses: actions/upload-artifact@v4
        with:
          name: ZENOCL-${{ github.run_number }}
          path: release/*.jar
          if-no-files-found: error
          retention-days: 30
          
