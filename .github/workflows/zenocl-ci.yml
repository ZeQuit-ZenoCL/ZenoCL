
name: ZENOCL Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenocl-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ZENOCL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZENOCL-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
          
